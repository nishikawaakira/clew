name: Release

on:
  push:
    tags:
      - 'v*'

# The release job needs to create a GitHub Release and upload assets.
# Build jobs read source only.
permissions:
  contents: read

# Opt into Node.js 24 for JavaScript-based actions ahead of GitHub's
# 2026-06-02 forced switch, silencing the Node.js 20 deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-darwin:
    name: build (darwin-universal)
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build arm64 (native)
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          mkdir -p build
          go build -trimpath -ldflags "-s -w" -o build/clew-arm64 .

      # Cross-compile amd64 from the arm64 runner using clang's -arch flag.
      # macOS Xcode ships SDKs for both architectures, and go-duckdb bundles
      # pre-built static libraries for darwin_amd64, so this works without
      # an Intel runner (macos-13 is essentially unavailable due to capacity).
      - name: Build amd64 (cross-compile via -arch x86_64)
        env:
          GOOS: darwin
          GOARCH: amd64
          CC: "clang -arch x86_64"
          CXX: "clang++ -arch x86_64"
        run: |
          go build -trimpath -ldflags "-s -w" -o build/clew-amd64 .

      - name: Combine into universal binary with lipo
        run: |
          mkdir -p dist
          out="dist/clew-${{ github.ref_name }}-darwin-universal"
          lipo -create build/clew-arm64 build/clew-amd64 -output "$out"
          lipo -info "$out"
          file "$out"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clew-darwin-universal
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: build (windows-amd64)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          out="dist/clew-${{ github.ref_name }}-windows-amd64.exe"
          go build -trimpath -ldflags "-s -w" -o "$out" .
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clew-windows-amd64
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: [build-darwin, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
