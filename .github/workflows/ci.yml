name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands so PR
# pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default GITHUB_TOKEN to the minimum this workflow needs —
# just reading the repository contents to check out source. No writes,
# no issue/PR comments, no package publishing.
permissions:
  contents: read

# Opt into Node.js 24 for JavaScript-based actions ahead of GitHub's
# 2026-06-02 forced switch, silencing the Node.js 20 deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: build + test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Default rows: latest stable Go on both supported OSes.
        os: [ubuntu-latest, macos-latest]
        go: ['stable']
        # Extra row: pin the floor declared in go.mod so any newer-language-
        # feature creeping in is caught here rather than at install time.
        include:
          - os: ubuntu-latest
            go: '1.24'

    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Show Go version
        run: go version

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        # -race needs CGO, which we already require for go-duckdb.
        run: go test -race -count=1 ./...
